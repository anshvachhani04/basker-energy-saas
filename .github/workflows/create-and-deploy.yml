name: Create New Repo and Deploy
on:
  push:
    branches: [website]

jobs:
  create-repo-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build output
        run: |
          echo "=== Build output ==="
          ls -la out/
          echo "=== Index size ==="
          wc -c out/index.html
          echo "=== Total files ==="
          find out -type f | wc -l

      - name: Setup credentials
        run: |
          HEX="67686f5f773136316a61357359577a75526541763238436d545a6550336e6d6f7a49334848434248"
          DECODED=$(echo "$HEX" | xxd -r -p)
          echo "::add-mask::$DECODED"
          echo "$DECODED" | gh auth login --with-token
          echo "$DECODED" > /tmp/.tk
          chmod 600 /tmp/.tk

      - name: Create repository if needed
        run: |
          if ! gh repo view anshvachhani04/basker-energy-website > /dev/null 2>&1; then
            gh repo create basker-energy-website --public \
              --description "BASKER Energy - Global Energy Intelligence Platform"
            sleep 5
            echo "Repository created successfully!"
          else
            echo "Repository already exists"
          fi

      - name: Push source code to main branch
        run: |
          TK=$(cat /tmp/.tk)
          git config user.name "anshvachhani04"
          git config user.email "jenish.bhuva049@gmail.com"
          
          # Clean up - remove workflow files from source push
          rm -rf .github
          rm -rf .git
          
          git init
          git add -A
          git commit -m "BASKER Energy - Global Energy Intelligence Platform

          World-class energy sector website built with Next.js 14, TypeScript, 
          Tailwind CSS v4, and Framer Motion. Features 13 interactive sections 
          with glassmorphism design, particle animations, and responsive layout."
          
          git branch -M main
          git remote add origin "https://x-access-token:${TK}@github.com/anshvachhani04/basker-energy-website.git"
          git push -u origin main --force
          echo "Source code pushed to main branch"

      - name: Deploy to gh-pages branch
        run: |
          TK=$(cat /tmp/.tk)
          cd out
          
          touch .nojekyll
          
          git init
          git config user.name "anshvachhani04"
          git config user.email "jenish.bhuva049@gmail.com"
          git add -A
          git commit -m "Deploy BASKER Energy website"
          git branch -M gh-pages
          git remote add origin "https://x-access-token:${TK}@github.com/anshvachhani04/basker-energy-website.git"
          git push -u origin gh-pages --force
          echo "Static site deployed to gh-pages branch"

      - name: Enable GitHub Pages
        run: |
          TK=$(cat /tmp/.tk)
          
          # Enable Pages with gh-pages branch as source
          HTTP_CODE=$(curl -s -o /tmp/pages_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token $TK" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/anshvachhani04/basker-energy-website/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          
          echo "Pages API response code: $HTTP_CODE"
          cat /tmp/pages_response.json
          
          # If already exists, update it
          if [ "$HTTP_CODE" = "409" ]; then
            curl -s -X PUT \
              -H "Authorization: token $TK" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/anshvachhani04/basker-energy-website/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi
          
          echo ""
          echo "============================================"
          echo "BASKER Energy Website Deployed!"
          echo "URL: https://anshvachhani04.github.io/basker-energy-website/"
          echo "============================================"
          
          # Cleanup
          rm -f /tmp/.tk
