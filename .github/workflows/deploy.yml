name: Deploy BASKER Energy Website

on:
  push:
    branches: [ website ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website branch
        uses: actions/checkout@v4
        with:
          ref: website

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Patch next.config for static export
        run: |
          python3 -c "
          content = '''import type { NextConfig } from \"next\";
          const nextConfig: NextConfig = {
            output: \"export\",
            trailingSlash: true,
            images: { unoptimized: true },
          };
          export default nextConfig;
          '''
          open('next.config.ts', 'w').write(content)
          print('next.config.ts patched')
          "

      - name: Build static export
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false

      - name: Enable GitHub Pages via API
        run: |
          echo "Enabling GitHub Pages..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "POST status: $STATUS"
          if [ "$STATUS" = "422" ]; then
            echo "Pages already exists, updating..."
            curl -s -X PUT \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi
          echo "Website URL: https://anshvachhani04.github.io/basker-energy-saas/"
