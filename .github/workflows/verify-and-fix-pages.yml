name: Verify and Fix GitHub Pages

on:
  push:
    branches: [ website ]
    paths:
      - '.github/workflows/verify-and-fix-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check GitHub Pages Status
        id: pages-check
        run: |
          echo "=== Checking GitHub Pages Status ==="
          
          RESPONSE=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          
          echo "Response: $RESPONSE"
          
          STATUS=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','NOT_ENABLED'))" 2>/dev/null || echo "NOT_FOUND")
          URL=$(echo "$RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('html_url',''))" 2>/dev/null || echo "")
          
          echo "Pages Status: $STATUS"
          echo "Pages URL: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          
      - name: Enable Pages if not enabled
        if: steps.pages-check.outputs.url == ''
        run: |
          echo "Pages not enabled - enabling now..."
          curl -s \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}'
            
      - name: Final Pages URL
        run: |
          FINAL=$(curl -s \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "=== FINAL PAGES STATUS ==="
          echo "$FINAL" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('Status:', d.get('status','unknown'))
          print('URL:', d.get('html_url','not set'))
          print('Branch:', d.get('source',{}).get('branch','not set'))
          "
